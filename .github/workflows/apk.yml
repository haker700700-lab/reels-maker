name: 📱 بناء تطبيق APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: قبول تراخيص SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: بناء APK
        env:
          ORG_GRADLE_PROJECT_appToken: ${{ secrets.APP_TOKEN }}
          ORG_GRADLE_PROJECT_appRepo: ${{ github.repository }}
          ORG_GRADLE_PROJECT_ttPub: ${{ vars.TT_PUB }}
        run: |
          [ -n "$ORG_GRADLE_PROJECT_appToken" ] || { echo "::error::الـ Secret اسمه APP_TOKEN مش متضاف"; exit 1; }
          gradle -p android assembleDebug --no-daemon
      - name: نشر الـ APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ReelsMaker.apk
          gh release delete apk-latest --cleanup-tag -y || true
          gh release create apk-latest ReelsMaker.apk --title "📱 تطبيق صانع الريلز" \
            --notes "نزّل ReelsMaker.apk وثبّته."
