name: 📤 ناشر الريلز (تلقائي)
run-name: publisher

# بيشتغل لوحده كل 5 دقايق على سيرفر GitHub، وينشر الريلز اللي معادها جه — حتى لو موبايلك مقفول أو من غير نت.
# لو مفيش حاجة معادها جه بيخلص في ثواني. (للريبو العام مجاني.)
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reels-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: تجهيز
        run: python -m pip install -q --disable-pip-version-check cryptography
      - name: نشر المستحق
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: python cloud/publisher.py run
